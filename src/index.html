<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vesper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="app">
    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region><img src="assets/logo.svg" alt=""><span data-tauri-drag-region>Vesper</span></div>
      <div class="wc">
        <button data-win="min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button data-win="max" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
        <button data-win="close" class="close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
      </div>
    </header>
    <aside class="sidebar">
      <nav id="nav"></nav>
      <button class="acct-chip" id="acct-chip"></button>
    </aside>
    <main id="view"></main>
    <div id="dock"></div>
  </div>
  <div id="console-root"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
