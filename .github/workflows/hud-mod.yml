# Builds the Vesper HUD mod for each supported Minecraft version and publishes the jars (with SHA-256
# files, which the launcher checks) to the `hud-latest` release. Run it by hand from the Actions tab.
name: HUD mod
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['hud-mod/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: hud-mod
        run: |
          gradle build --no-daemon
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          mkdir -p ../dist
          JAR=$(ls build/libs/*.jar | grep -v -e sources -e dev | head -n1)
          cp "$JAR" "../dist/vesper-hud-$MC.jar"
          (cd ../dist && sha256sum "vesper-hud-$MC.jar" > "vesper-hud-$MC.jar.sha256")
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hud-latest
          name: Vesper HUD mod
          files: dist/*
