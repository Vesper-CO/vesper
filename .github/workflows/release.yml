name: Release

# Push a tag such as v0.3.0 (the same version as in src-tauri/tauri.conf.json), or run it by hand on a tag
# that already exists to fill in a release that is missing files.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, for example v0.3.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            installer/src-tauri -> target

      - name: Check the update signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is empty. Add it under Settings > Secrets and variables > Actions: the full text of your vesper.key file. Without it no update can be signed, so there is no latest.json."
            exit 1
          fi

      - name: Discord application id
        shell: bash
        env:
          RAW: ${{ vars.DISCORD_APP_ID || secrets.DISCORD_APP_ID }}
        run: |
          id=$(printf '%s' "$RAW" | tr -dc '0-9')
          if [ ${#id} -lt 17 ] || [ ${#id} -gt 20 ]; then
            echo "::warning::DISCORD_APP_ID is missing or not a Discord application id (17-20 digits). This build has no Discord Rich Presence. Add it under Settings > Secrets and variables > Actions > Variables, then build again."
            id=""
          else
            echo "Discord Rich Presence is on in this build (application id ${id:0:4}...)."
          fi
          echo "VESPER_DISCORD_APP_ID=$id" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Build Vesper (signed installer)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Write latest.json
        shell: bash
        run: node scripts/make-latest-json.mjs "$TAG" "${{ github.repository }}" "Vesper $TAG" | tee latest.log

      - name: Build Vesper-Setup.exe
        shell: pwsh
        run: |
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found!" }
          New-Item -ItemType Directory -Force installer/src-tauri/payload | Out-Null
          Copy-Item $nsis.FullName installer/src-tauri/payload/vesper-setup.exe
          Push-Location installer
          npm install
          npx tauri build --no-bundle
          Pop-Location
          Copy-Item installer/src-tauri/target/release/vesper-setup.exe Vesper-Setup.exe

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS='|' read -r exe sig json < <(grep '^FILES=' latest.log | cut -d= -f2-)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Vesper $TAG" --notes "Download Vesper-Setup.exe below. Existing installs update themselves."
          fi
          gh release upload "$TAG" "$exe" "$sig" "$json" Vesper-Setup.exe --clobber
          echo "Release assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx latest.json
